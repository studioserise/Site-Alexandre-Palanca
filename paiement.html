<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png?v=3">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Coordonnées de virement pour votre prestation Alexandre Palanca.">
  <title>Fiche de virement — Alexandre Palanca</title>
  <link rel="stylesheet" href="galeries.css?v=outil">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="site-nav.css?v=langue">
  <link rel="stylesheet" href="reponse-devis.css?v=5">
  <script src="site-nav.js?v=langue" defer></script>
  <script type="module" src="paiement.js?v=2"></script>
</head>
<body>
  <header class="site-nav is-visible" id="site-nav">
    <div class="site-nav-inner">
      <a class="site-nav-brand" href="index.html#accueil" aria-label="Retour à l'accueil">
        <span class="site-nav-logo-frame" aria-hidden="true"><span class="site-nav-logo-canvas"><img src="images/logo-accueil.png" alt=""></span></span>
      </a>
    </div>
  </header>
  <main class="gallery-error-page quote-page">
    <section class="gallery-message-card quote-card">
      <p class="gallery-eyebrow" id="p-eyebrow">Virement</p>
      <h1 id="p-title">Fiche de virement</h1>
      <p class="gallery-intro" id="p-intro" role="status">Chargement…</p>
      <div id="p-sheet" hidden>
        <dl class="quote-summary" id="p-facts"></dl>
        <div class="transfer-sheet" id="p-transfer"></div>
        <p class="quote-help transfer-help">Dans l'application de votre banque : ajoutez ce bénéficiaire (nom + IBAN), puis faites un virement du montant indiqué en mettant la référence dans le libellé. Touchez « Copier » pour copier chaque information.</p>
        <div class="quote-choice">
          <button class="gallery-primary-button" id="p-done" type="button">J'ai effectué le virement</button>
        </div>
        <p class="gallery-form-message" id="p-message" role="alert"></p>
      </div>
      <a class="gallery-back-link" href="index.html">Retour au site</a>
    </section>
  </main>
</body>
</html>
